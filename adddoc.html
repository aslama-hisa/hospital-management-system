      <form>
            <h3>ADD DOCTOR</h3>
            <label>Doctor Name</label>
            <input type="text" placeholder="Enter Doctor name" id="docname">
            <label>Department</label>
            <select name="dep" placeholder="Enter Department" title="Enter Department" id="dep">
                  <option value="" disabled selected>Departments</option>
            </select>
            <label for="username">Email</label>
            <input type="text" placeholder="Email" id="email">
            <label for="password">Password</label>
            <input type="password" placeholder="Password" id="password">
            <center>
                  <br>
                  <br>
                  <button onclick="doclog()">ADD </button>
                  <br>
            </center>
      </form>
      <script>
            function doclog() {
                  event.preventDefault();

                  // Get the email input element and its value
                  let emailInput = document.getElementById("email");
                  let email = emailInput.value;

                  // Email validation using a regular expression
                  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                  if (!emailRegex.test(email)) {
                        alert("Please enter a valid email address");
                        emailInput.focus();
                        return;
                  }

                  let data = {};
                  data.name = document.getElementById("docname").value;
                  data.department = document.getElementById("dep").value;
                  data.email = email; // Use the validated email
                  data.password = document.getElementById("password").value;
                  data = JSON.stringify(data);

                  const xhr = new XMLHttpRequest();
                  xhr.withCredentials = true;

                  xhr.addEventListener("readystatechange", function () {
                        if (this.readyState === this.DONE) {
                              console.log(this.responseText);
                        }
                  });

                  xhr.open("POST", "http://localhost:3000/signupdoctor");
                  xhr.setRequestHeader("Accept", "/");
                  xhr.setRequestHeader("Content-Type", "application/json");
                  xhr.send(data);

                  alert("Doctor added successfully");
            }

      </script>
      <script>
            allDept();
    function allDept() {
      const xhr = new XMLHttpRequest();
      xhr.withCredentials = true;
      const dept = document.getElementById('dep');
      xhr.addEventListener("readystatechange", function () {
        if (this.readyState === this.DONE) {
          const res = JSON.parse(this.responseText);
          res.data.forEach(i => {
            dept.innerHTML += `<option value="${i.name}">${i.name}</option>`;
          });
        }
      });

      xhr.open("GET", "http://localhost:3000/getdept");
      xhr.setRequestHeader("Accept", "/");
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.send(null);
    }

      </script>
